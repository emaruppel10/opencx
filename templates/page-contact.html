<!-- wp:template-part {"slug":"header-contact","tagName":"header"} /-->

<section class="wp-block-group alignfull ocx-section ocx-contact-hero__section">

	<!-- Outer frame (Figma node #12895:2836) -->
	<div class="ocx-contact-hero__outer">

		<!-- Inner container with 20px radius producing corner triangles (Figma node #12895:2837) -->
		<div class="ocx-contact-hero__container">

			<!-- Layout grid: 1fr left spacer / 2fr right content -->
			<div class="ocx-contact-hero__grid">

				<!-- Left spacer column (Figma node #12895:2882) -->
				<div class="ocx-contact-hero__col-spacer" aria-hidden="true"></div>

				<!-- Right content column (Figma node #12895:2883 + #12895:2840) -->
				<div class="ocx-contact-hero__col-main">

					<!-- Headline block (Figma node #12895:2883) -->
					<div class="ocx-contact-hero__header">
						<h1 class="wp-block-heading ocx-contact-hero__title">
							Let's see what this looks like <span class="ocx-contact-hero__title-accent">inside your business.</span>
						</h1>
						<p class="ocx-contact-hero__lead">
							No generic demo. Bring a real workflow, and we'll show you what it looks like automated by a system that actually understands it.
						</p>
					</div>

					<!-- Form block (Figma node #12895:2840) -->
					<div class="ocx-contact-hero__form-section">

						<div class="ocx-contact-hero__form-header">
							<h2 class="wp-block-heading ocx-contact-hero__form-heading">Contact us</h2>
							<p class="ocx-contact-hero__form-lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
						</div>

						<!-- Form container (Figma node #12895:2846) -->
						<div class="ocx-contact-hero__form-wrap">
							<form class="ocx-c4__form ocx-contact-form" method="post" action="" novalidate>

								<div class="ocx-c4__row">
									<p class="ocx-c4__field">
										<label class="ocx-c4__label" for="ocx-first-name">First name</label>
										<input class="ocx-c4__input" id="ocx-first-name" name="first_name" type="text" autocomplete="given-name" />
									</p>
									<p class="ocx-c4__field">
										<label class="ocx-c4__label" for="ocx-last-name">Last name</label>
										<input class="ocx-c4__input" id="ocx-last-name" name="last_name" type="text" autocomplete="family-name" />
									</p>
								</div>

								<div class="ocx-c4__row">
									<p class="ocx-c4__field">
										<label class="ocx-c4__label" for="ocx-email">Email</label>
										<input class="ocx-c4__input" id="ocx-email" name="email" type="email" autocomplete="email" />
									</p>
									<p class="ocx-c4__field">
										<label class="ocx-c4__label" for="ocx-phone">Phone number</label>
										<input class="ocx-c4__input" id="ocx-phone" name="phone" type="tel" autocomplete="tel" />
									</p>
								</div>

								<p class="ocx-c4__field">
									<label class="ocx-c4__label" for="ocx-topic">Choose a topic</label>
									<select class="ocx-c4__select" id="ocx-topic" name="topic">
										<option value="" selected>Select one..&#46;</option>
										<option value="enterprise">Enterprise OS</option>
										<option value="partnership">Partnership</option>
										<option value="general">General inquiry</option>
									</select>
								</p>

								<div class="ocx-c4__radios" role="group" aria-labelledby="ocx-role-label">
									<p class="ocx-c4__label" id="ocx-role-label">Which best describes you?</p>
									<div class="ocx-c4__radios-list">
										<div class="ocx-c4__radio-row">
											<label class="ocx-c4__radio" for="ocx-choice-1"><input id="ocx-choice-1" name="role" type="radio" value="first" /><span>First choice</span></label>
											<label class="ocx-c4__radio" for="ocx-choice-2"><input id="ocx-choice-2" name="role" type="radio" value="second" /><span>Second choice</span></label>
										</div>
										<div class="ocx-c4__radio-row">
											<label class="ocx-c4__radio" for="ocx-choice-3"><input id="ocx-choice-3" name="role" type="radio" value="third" /><span>Third choice</span></label>
											<label class="ocx-c4__radio" for="ocx-choice-4"><input id="ocx-choice-4" name="role" type="radio" value="fourth" /><span>Fourth choice</span></label>
										</div>
										<div class="ocx-c4__radio-row">
											<label class="ocx-c4__radio" for="ocx-choice-5"><input id="ocx-choice-5" name="role" type="radio" value="fifth" /><span>Fifth choice</span></label>
											<label class="ocx-c4__radio" for="ocx-other"><input id="ocx-other" name="role" type="radio" value="other" /><span>Other</span></label>
										</div>
									</div>
								</div>

								<p class="ocx-c4__field">
									<label class="ocx-c4__label" for="ocx-message">Message</label>
									<textarea class="ocx-c4__textarea" id="ocx-message" name="message" rows="6" placeholder="Type your message..."></textarea>
								</p>

								<p class="ocx-c4__checkbox">
									<input id="ocx-terms" name="terms" type="checkbox" value="1" />
									<label class="ocx-c4__checkbox-text" for="ocx-terms">I accept the <a href="/terms-of-service/">Terms</a></label>
								</p>

								<div class="wp-block-buttons ocx-c4__submit">
									<button type="submit" class="ocx-btn--primary ocx-contact-submit-btn">Submit</button>
								</div>

							</form>
						</div>

					</div>

				</div>

			</div>

		</div>

	</div>

</section>

<!-- wp:template-part {"slug":"footer","tagName":"footer"} /-->
