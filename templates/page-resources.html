<!-- wp:template-part {"slug":"header-resources","tagName":"header"} /-->

<main class="ocx-resources-page">

	<!-- Hero - Insights / Resources -->
	<section class="ocx-res-hero__section">
		<div class="ocx-res-hero__outer">
			<div class="ocx-res-hero__card">
				<div class="ocx-res-hero__content">
					<p class="ocx-res-hero__tagline">Resources</p>
					<h1 class="ocx-res-hero__title">Things worth knowing before <span class="ocx-res-hero__accent">your next AI decision.</span></h1>
				</div>
			</div>
		</div>
	</section>

	<!-- Textured Divider with Filter Tabs -->
	<section class="ocx-res-divider__section">
		<div class="ocx-res-divider__container">
			<div class="ocx-res-divider__filters" role="tablist" aria-label="Resource Categories">
				<button type="button" class="ocx-res-filter-btn ocx-res-filter-btn--active" role="tab" aria-selected="true" data-filter="client-perspective">Client perspective</button>
				<button type="button" class="ocx-res-filter-btn" role="tab" aria-selected="false" data-filter="blog">Blog</button>
				<button type="button" class="ocx-res-filter-btn" role="tab" aria-selected="false" data-filter="newsroom">Newsroom</button>
			</div>
		</div>
	</section>

	<!-- Client perspective Section -->
	<section class="ocx-res-perspective__section" id="client-perspective">
		<div class="ocx-res-perspective__wrapper">
			<div class="ocx-res-perspective__outer">
				<div class="ocx-res-perspective__inner">

					<header class="ocx-res-perspective__header">
						<h2 class="ocx-res-perspective__heading">Client<br>perspective</h2>
					</header>

					<!-- Dynamic Client Perspective Interviews (Grid & Expandable Panels) -->
					<!-- wp:shortcode -->[opencx_resources_interviews]<!-- /wp:shortcode -->

				</div>
			</div>
		</div>
	</section>

	<!-- =========================================================================
	     Blog Section
	     ========================================================================= -->
	<section class="ocx-res-perspective__section" id="blog" style="display: none;">
		<div class="ocx-res-perspective__wrapper">
			<div class="ocx-res-perspective__outer">
				<div class="ocx-res-perspective__inner">

					<header class="ocx-res-perspective__header">
						<h2 class="ocx-res-perspective__heading">OpenCX<br>Blog</h2>
					</header>

					<!-- Dynamic Blog Cards Grid -->
					<!-- wp:shortcode -->[opencx_resources_blog]<!-- /wp:shortcode -->

				</div>
			</div>
		</div>
	</section>

	<!-- =========================================================================
	     Newsroom Section
	     ========================================================================= -->
	<section class="ocx-res-perspective__section" id="newsroom" style="display: none;">
		<div class="ocx-res-perspective__wrapper">
			<div class="ocx-res-perspective__outer">
				<div class="ocx-res-perspective__inner">

					<header class="ocx-res-perspective__header">
						<h2 class="ocx-res-perspective__heading">OpenCX<br>Newsroom</h2>
					</header>

					<!-- Dynamic Newsroom Cards Grid -->
					<!-- wp:shortcode -->[opencx_resources_newsroom]<!-- /wp:shortcode -->

				</div>
			</div>
		</div>
	</section>

</main>

<script>
(function() {
	function initResources() {
		// Category Tabs Switcher
		const filterButtons = document.querySelectorAll('.ocx-res-filter-btn');
		const sections = {
			'client-perspective': document.getElementById('client-perspective'),
			'blog': document.getElementById('blog'),
			'newsroom': document.getElementById('newsroom')
		};

		function switchCategory(category, updateHash) {
			if (!sections[category]) return;

			filterButtons.forEach(btn => {
				const isActive = btn.dataset.filter === category;
				btn.classList.toggle('ocx-res-filter-btn--active', isActive);
				btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
			});

			Object.keys(sections).forEach(cat => {
				if (sections[cat]) {
					sections[cat].style.display = (cat === category) ? 'block' : 'none';
				}
			});

			if (updateHash && window.history && window.history.replaceState) {
				window.history.replaceState(null, '', '#' + category);
			}
		}

		filterButtons.forEach(btn => {
			btn.addEventListener('click', function(e) {
				e.preventDefault();
				const cat = btn.dataset.filter;
				if (cat) {
					switchCategory(cat, true);
				}
			});
		});

		// -------------------------------------------------------------
		// Pagination Controller (4 items per page across all 3 sections)
		// -------------------------------------------------------------
		const ITEMS_PER_PAGE = 4;

		function setupPagination(config) {
			const { category, gridId, paginationId } = config;
			const grid = document.getElementById(gridId);
			const paginationEl = document.getElementById(paginationId);
			if (!grid || !paginationEl) {
				return { goToPage: () => {}, reset: () => {}, render: () => {}, hide: () => {}, show: () => {} };
			}

			let currentPage = 1;

			function getEligibleCards() {
				const allCards = Array.from(grid.querySelectorAll('.ocx-res-card:not(.ocx-res-card--placeholder)'));
				return allCards.filter(c => c.dataset.filterHidden !== 'true');
			}

			function render() {
				const eligibleCards = getEligibleCards();
				const totalCards = eligibleCards.length;
				const totalPages = Math.ceil(totalCards / ITEMS_PER_PAGE) || 1;

				if (currentPage > totalPages) {
					currentPage = totalPages;
				}
				if (currentPage < 1) {
					currentPage = 1;
				}

				const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
				const endIndex = startIndex + ITEMS_PER_PAGE;

				// Hide filtered-out cards
				const allCards = Array.from(grid.querySelectorAll('.ocx-res-card:not(.ocx-res-card--placeholder)'));
				allCards.forEach(c => {
					if (c.dataset.filterHidden === 'true') {
						c.style.display = 'none';
					}
				});

				// Slice eligible cards
				eligibleCards.forEach((card, index) => {
					if (index >= startIndex && index < endIndex) {
						card.style.display = 'flex';
					} else {
						card.style.display = 'none';
					}
				});

				// If only 1 page, hide pagination controls
				if (totalPages <= 1) {
					paginationEl.style.display = 'none';
					paginationEl.innerHTML = '';
					return;
				}

				paginationEl.style.display = 'flex';

				// Build pagination controls HTML
				let html = '';

				// Previous Button
				const prevDisabled = currentPage === 1 ? 'disabled aria-disabled="true"' : '';
				html += '<button type="button" class="ocx-pagination__btn ocx-pagination__btn--prev" data-page="' + (currentPage - 1) + '" ' + prevDisabled + ' aria-label="Previous page">';
				html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
				html += '<span>Prev</span>';
				html += '</button>';

				// Desktop Numbers
				html += '<div class="ocx-pagination__numbers">';
				for (let p = 1; p <= totalPages; p++) {
					const isActive = p === currentPage;
					const activeClass = isActive ? 'is-active' : '';
					const ariaCurrent = isActive ? 'aria-current="page"' : '';
					html += '<button type="button" class="ocx-pagination__btn ocx-pagination__btn--number ' + activeClass + '" data-page="' + p + '" ' + ariaCurrent + ' aria-label="Page ' + p + '">';
					html += p;
					html += '</button>';
				}
				html += '</div>';

				// Mobile Information Indicator (Compact and ergonomically centered)
				html += '<div class="ocx-pagination__mobile-info" aria-live="polite">';
				html += 'Page ' + currentPage + ' of ' + totalPages;
				html += '</div>';

				// Next Button
				const nextDisabled = currentPage === totalPages ? 'disabled aria-disabled="true"' : '';
				html += '<button type="button" class="ocx-pagination__btn ocx-pagination__btn--next" data-page="' + (currentPage + 1) + '" ' + nextDisabled + ' aria-label="Next page">';
				html += '<span>Next</span>';
				html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
				html += '</button>';

				paginationEl.innerHTML = html;

				// Attach click handlers
				const btns = paginationEl.querySelectorAll('.ocx-pagination__btn[data-page]');
				btns.forEach(btn => {
					btn.addEventListener('click', function(e) {
						e.preventDefault();
						if (btn.disabled || btn.classList.contains('is-active')) return;
						const targetPage = parseInt(btn.dataset.page, 10);
						if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= totalPages) {
							goToPage(targetPage, true);
						}
					});
				});
			}

			function goToPage(page, shouldScroll) {
				currentPage = page;
				render();
				if (shouldScroll) {
					grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
				}
			}

			function reset() {
				currentPage = 1;
				render();
			}

			render();

			return {
				goToPage,
				reset,
				render,
				hide: function() { paginationEl.style.display = 'none'; },
				show: function() { render(); }
			};
		}

		// Initialize Pagination for the 3 sections
		const paginators = {
			'client-perspective': setupPagination({
				category: 'client-perspective',
				gridId: 'perspective-grid',
				paginationId: 'perspective-pagination'
			}),
			'blog': setupPagination({
				category: 'blog',
				gridId: 'blog-grid',
				paginationId: 'blog-pagination'
			}),
			'newsroom': setupPagination({
				category: 'newsroom',
				gridId: 'newsroom-grid',
				paginationId: 'newsroom-pagination'
			})
		};

		// Helper to setup section expansion for Interviews, Blog, and Newsroom
		function setupSectionExpanders(config) {
			const {
				category,
				cardSelector,
				cardDataAttr,
				panelPrefix,
				closeSelector,
				switchSelector,
				switchDataAttr,
				gridId,
				headerPrefix
			} = config;

			const cards = document.querySelectorAll(cardSelector);
			const panels = document.querySelectorAll('.ocx-interview-panel[id^="' + panelPrefix + '"]');
			const switcherCards = document.querySelectorAll(switchSelector);
			const closeButtons = document.querySelectorAll(closeSelector);

			function openItem(id, shouldScroll) {
				switchCategory(category, false);

				panels.forEach(p => {
					if (p.id === panelPrefix + id) {
						p.classList.add('is-open');
					} else {
						p.classList.remove('is-open');
					}
				});

				cards.forEach(c => {
					const match = c.dataset[cardDataAttr] === id;
					c.classList.toggle('is-active', match);
					c.setAttribute('aria-expanded', match ? 'true' : 'false');
				});

				// Hide pagination controls while reading panel is open
				if (paginators[category]) {
					paginators[category].hide();
				}

				if (window.history && window.history.replaceState) {
					window.history.replaceState(null, '', '#' + id);
				}

				if (shouldScroll) {
					const targetHeader = document.getElementById(headerPrefix + id);
					if (targetHeader) {
						setTimeout(() => {
							targetHeader.scrollIntoView({ behavior: 'smooth', block: 'start' });
						}, 150);
					}
				}
			}

			function closeItem() {
				panels.forEach(p => p.classList.remove('is-open'));
				cards.forEach(c => {
					c.classList.remove('is-active');
					c.setAttribute('aria-expanded', 'false');
				});

				// Restore pagination controls when closing panel
				if (paginators[category]) {
					paginators[category].show();
				}

				if (window.history && window.history.replaceState) {
					window.history.replaceState(null, '', '#' + category);
				}
				const grid = document.getElementById(gridId);
				if (grid) {
					grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
				}
			}

			cards.forEach(card => {
				const id = card.dataset[cardDataAttr];
				card.addEventListener('click', function(e) {
					e.preventDefault();
					const panel = document.getElementById(panelPrefix + id);
					if (panel && panel.classList.contains('is-open')) {
						closeItem();
					} else {
						openItem(id, true);
					}
				});
				card.addEventListener('keydown', function(e) {
					if (e.key === 'Enter' || e.key === ' ') {
						e.preventDefault();
						card.click();
					}
				});
			});

			switcherCards.forEach(btn => {
				const targetId = btn.dataset[switchDataAttr];
				btn.addEventListener('click', function(e) {
					e.preventDefault();
					openItem(targetId, true);
				});
				btn.addEventListener('keydown', function(e) {
					if (e.key === 'Enter' || e.key === ' ') {
						e.preventDefault();
						btn.click();
					}
				});
			});

			closeButtons.forEach(btn => {
				btn.addEventListener('click', function(e) {
					e.preventDefault();
					closeItem();
				});
			});

			return { openItem, closeItem };
		}

		// 1. Interviews
		const interviewCtrl = setupSectionExpanders({
			category: 'client-perspective',
			cardSelector: '.ocx-res-card[data-interview]',
			cardDataAttr: 'interview',
			panelPrefix: 'interview-',
			closeSelector: '[data-close]',
			switchSelector: '[data-switch-interview]',
			switchDataAttr: 'switchInterview',
			gridId: 'perspective-grid',
			headerPrefix: 'author-'
		});

		// 2. Blog
		const blogCtrl = setupSectionExpanders({
			category: 'blog',
			cardSelector: '.ocx-res-card[data-blog]',
			cardDataAttr: 'blog',
			panelPrefix: 'blog-',
			closeSelector: '[data-close-blog]',
			switchSelector: '[data-switch-blog]',
			switchDataAttr: 'switchBlog',
			gridId: 'blog-grid',
			headerPrefix: 'header-blog-'
		});

		// 3. Newsroom
		const newsCtrl = setupSectionExpanders({
			category: 'newsroom',
			cardSelector: '.ocx-res-card[data-news]',
			cardDataAttr: 'news',
			panelPrefix: 'news-',
			closeSelector: '[data-close-news]',
			switchSelector: '[data-switch-news]',
			switchDataAttr: 'switchNews',
			gridId: 'newsroom-grid',
			headerPrefix: 'header-news-'
		});

		// Top scroll buttons
		const topButtons = document.querySelectorAll('[data-scroll-top]');
		topButtons.forEach(btn => {
			btn.addEventListener('click', function(e) {
				e.preventDefault();
				const targetId = btn.dataset.scrollTop;
				const el = document.getElementById(targetId);
				if (el) {
					el.scrollIntoView({ behavior: 'smooth', block: 'start' });
				}
			});
		});

		// -------------------------------------------------------------
		// Interactive Filter Handler for Tags and Author
		// -------------------------------------------------------------
		function escapeHtml(str) {
			const div = document.createElement('div');
			div.textContent = str;
			return div.innerHTML;
		}

		function applyGridFilter(category, type, value) {
			const section = sections[category];
			if (!section) return;

			// Close any open panel in that section
			const openPanels = section.querySelectorAll('.ocx-interview-panel.is-open');
			openPanels.forEach(p => p.classList.remove('is-open'));
			const activeCards = section.querySelectorAll('.ocx-res-card.is-active');
			activeCards.forEach(c => {
				c.classList.remove('is-active');
				c.setAttribute('aria-expanded', 'false');
			});

			const filterBar = document.getElementById(category + '-active-filter-bar');
			const filterLabel = document.getElementById(category + '-filter-label');
			const filterCount = document.getElementById(category + '-filter-count');
			const cards = section.querySelectorAll('.ocx-res-card:not(.ocx-res-card--placeholder)');

			let matchCount = 0;
			const cleanVal = (value || '').trim().toLowerCase();

			cards.forEach(card => {
				let matches = false;
				if (type === 'tag') {
					const tagsStr = (card.dataset.tags || '').toLowerCase();
					const tagsArr = tagsStr.split(',').map(s => s.trim());
					matches = tagsArr.includes(cleanVal);
				} else if (type === 'author') {
					const authorStr = (card.dataset.author || '').toLowerCase();
					matches = (authorStr === cleanVal || authorStr.indexOf(cleanVal) !== -1);
				}

				if (matches) {
					card.dataset.filterHidden = 'false';
					matchCount++;
				} else {
					card.dataset.filterHidden = 'true';
				}
			});

			if (filterBar && filterLabel) {
				const displayPrefix = type === 'tag' ? 'Tag: #' : 'Author: ';
				filterLabel.innerHTML = displayPrefix + '<strong>' + escapeHtml(value) + '</strong>';
				if (filterCount) {
					filterCount.textContent = '(Showing ' + matchCount + ' of ' + cards.length + ')';
				}
				filterBar.style.display = 'flex';
			}

			// Re-calculate and reset pagination for the filtered subset
			if (paginators[category]) {
				paginators[category].reset();
			}

			// Scroll smoothly to active filter bar or grid
			const scrollTarget = filterBar || document.getElementById(category + '-grid');
			if (scrollTarget) {
				scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'start' });
			}
		}

		function clearGridFilter(category) {
			const section = sections[category];
			if (!section) return;

			const filterBar = document.getElementById(category + '-active-filter-bar');
			if (filterBar) filterBar.style.display = 'none';

			const cards = section.querySelectorAll('.ocx-res-card:not(.ocx-res-card--placeholder)');
			cards.forEach(card => {
				card.dataset.filterHidden = 'false';
			});

			// Re-calculate and reset pagination for all items
			if (paginators[category]) {
				paginators[category].reset();
			}
		}

		// Wire Clear Filter Buttons
		['blog', 'newsroom'].forEach(cat => {
			const clearBtn = document.getElementById(cat + '-filter-clear-btn');
			if (clearBtn) {
				clearBtn.addEventListener('click', function(e) {
					e.preventDefault();
					clearGridFilter(cat);
				});
			}
		});

		// Delegate Click on Filter Triggers (.ocx-filter-trigger)
		document.addEventListener('click', function(e) {
			const trigger = e.target.closest('.ocx-filter-trigger');
			if (!trigger) return;
			e.preventDefault();

			const type = trigger.dataset.filterType;
			const value = trigger.dataset.filterValue;
			// Find which section this trigger belongs to
			const section = trigger.closest('.ocx-res-perspective__section');
			const category = section ? section.id : 'blog';

			applyGridFilter(category, type, value);
		});

		// Check on load if URL has a hash
		const initialHash = window.location.hash.replace('#', '');
		if (initialHash) {
			if (initialHash === 'client-perspective') {
				switchCategory('client-perspective', false);
			} else if (initialHash === 'blog') {
				switchCategory('blog', false);
			} else if (initialHash === 'newsroom') {
				switchCategory('newsroom', false);
			} else if (document.getElementById('interview-' + initialHash)) {
				interviewCtrl.openItem(initialHash, true);
			} else if (document.getElementById('blog-' + initialHash)) {
				blogCtrl.openItem(initialHash, true);
			} else if (document.getElementById('news-' + initialHash)) {
				newsCtrl.openItem(initialHash, true);
			}
		}
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', initResources);
	} else {
		initResources();
	}
})();
</script>
